name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the zips; they publish only when started from a v* tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$(awk -v tag="$TAG" '$0 ~ "^## " tag "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --notes "${notes:-See CHANGELOG.md}"
          fi
